name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  fmt:
    name: gofumpt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofumpt (fail if any file needs formatting)
        run: |
          go install mvdan.cc/gofumpt@latest
          unformatted=$(gofumpt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofumpt-clean:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Clone and verify CLIProxyAPI SDK
        run: |
          CPA_VERSION=$(cat .cpa-version)
          CPA_COMMIT=$(cat .cpa-commit)
          git clone --depth 1 --branch "$CPA_VERSION" \
            https://github.com/Arkptz/CLIProxyAPI.git "$GITHUB_WORKSPACE/../CLIProxyAPI"
          ACTUAL=$(git -C "$GITHUB_WORKSPACE/../CLIProxyAPI" rev-parse HEAD)
          if [ "$ACTUAL" != "$CPA_COMMIT" ]; then
            echo "::error::CPA SDK tag $CPA_VERSION resolved to $ACTUAL, expected pinned SHA $CPA_COMMIT"
            exit 1
          fi
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.12.2

  test:
    name: go test -race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Clone and verify CLIProxyAPI SDK
        run: |
          CPA_VERSION=$(cat .cpa-version)
          CPA_COMMIT=$(cat .cpa-commit)
          git clone --depth 1 --branch "$CPA_VERSION" \
            https://github.com/Arkptz/CLIProxyAPI.git "$GITHUB_WORKSPACE/../CLIProxyAPI"
          ACTUAL=$(git -C "$GITHUB_WORKSPACE/../CLIProxyAPI" rev-parse HEAD)
          if [ "$ACTUAL" != "$CPA_COMMIT" ]; then
            echo "::error::CPA SDK tag $CPA_VERSION resolved to $ACTUAL, expected pinned SHA $CPA_COMMIT"
            exit 1
          fi
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Use the toolchain setup-go installs (latest 1.26.x patch), never let Go
      # silently download the older version pinned in go.mod.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Clone and verify CLIProxyAPI SDK
        run: |
          CPA_VERSION=$(cat .cpa-version)
          CPA_COMMIT=$(cat .cpa-commit)
          git clone --depth 1 --branch "$CPA_VERSION" \
            https://github.com/Arkptz/CLIProxyAPI.git "$GITHUB_WORKSPACE/../CLIProxyAPI"
          ACTUAL=$(git -C "$GITHUB_WORKSPACE/../CLIProxyAPI" rev-parse HEAD)
          if [ "$ACTUAL" != "$CPA_COMMIT" ]; then
            echo "::error::CPA SDK tag $CPA_VERSION resolved to $ACTUAL, expected pinned SHA $CPA_COMMIT"
            exit 1
          fi
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # Resolve the newest 1.26.x patch instead of go.mod's exact pin, so the
          # scan always runs against the latest patched stdlib.
          go-version: "1.26"
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1.47.2

  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - if: ${{ env.ACT == 'true' }}
        run: echo "::notice::flake-check is skipped under act — run 'nix flake check' in your devshell"
      - if: ${{ env.ACT != 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - if: ${{ env.ACT != 'true' }}
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - if: ${{ env.ACT != 'true' }}
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - if: ${{ env.ACT != 'true' }}
        run: nix flake check -L
