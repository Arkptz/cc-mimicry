name: Nightly fingerprint drift check

# All logic lives in scripts/ (this file is glue only):
#
#   CHECK 1 (binary-strings) — cheap early warning:
#     scripts/nightly/resolve-latest.sh      download + sha512-verify tarballs
#     scripts/nightly/binary-fingerprint.py  UA / beta / x-app from `strings`
#
#   CHECK 2 (wire-capture) — authoritative, runs only on sha512-verified bytes:
#     scripts/nightly/prepare-home.sh        seed onboarding state
#     scripts/nightly/fake-upstream.py       local always-401 upstream
#     scripts/recon/fetch-binary.sh          install the verified CLI
#     scripts/recon/capture-live.sh          drive both surfaces via mitmdump
#     scripts/nightly/stage-drift.py         compare vs testdata/captures, stage
#
#   Then the Go test suite runs on the staged tree, and ONE drift PR carries
#   everything (binary baseline + new captures + test verdict).
#
# Same-version wire drift is REPORTED but never auto-committed over existing
# fixtures: committed captures carry real-credential provenance (PROC-001);
# refreshing them is a deliberate recon, not a nightly action. A NEW CLI
# version gets its captures staged under testdata/captures/v<version>/.
#
# The drift PR is opened with the default GITHUB_TOKEN, which does NOT trigger
# `pull_request` workflows (GitHub limitation) — that is why the tests run in
# THIS workflow instead of waiting for ci.yml.
#
# PR mode: a pull request touching the nightly machinery (this file,
# scripts/nightly/, scripts/recon/, baseline/, testdata/captures/) runs the
# SAME pipeline as a validation gate — capture against the fake upstream,
# drift compare, tests — but never opens a drift PR. The same paths filter on
# push to main runs the pipeline right after merge instead of waiting for the
# 02:17 cron, where a drift PR IS opened (e.g. to auto-populate a placeholder
# baseline).

on:
  schedule:
    # 02:17 UTC — offset from :00 to avoid the cron thundering herd.
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fingerprint-nightly.yml'
      - 'scripts/nightly/**'
      - 'scripts/recon/**'
      - 'baseline/**'
      - 'testdata/captures/**'
  pull_request:
    paths:
      - '.github/workflows/fingerprint-nightly.yml'
      - 'scripts/nightly/**'
      - 'scripts/recon/**'
      - 'baseline/**'
      - 'testdata/captures/**'

permissions:
  contents: read
  pull-requests: read

# github.ref is unique per PR (refs/pull/N/merge) and shared by schedule and
# push to main (both refs/heads/main), so PRs cancel their own stale runs
# while scheduled runs never cancel each other mid-capture.
concurrency:
  group: fingerprint-nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_REGISTRY: 'https://registry.npmjs.org'
  # Fake, well-formed-but-invalid OAuth token. Shape passes the CLI's
  # client-side check (expiresAt in the future); the local fake upstream
  # answers 401. No real credentials ever enter this workflow.
  FAKE_ACCESS_TOKEN: 'sk-ant-oat01-CI-FAKE-NIGHTLY-PROBE'

jobs:
  nightly:
    name: Fingerprint drift (binary + wire + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Write scopes only exist off the PR path: on schedule/push the job opens
    # the drift PR and stages captures; on a pull_request it is a pure
    # validation gate (GitHub clamps fork PRs to read-only regardless).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install tools (strings / file / jq / mitmproxy)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends file binutils jq
          python -m pip install --upgrade pip
          pip install 'mitmproxy>=11,<13'
          mitmdump --version

      # --- CHECK 1: binary strings. The binary is NEVER executed here. ----
      - name: Resolve + download + sha512-verify latest tarballs
        id: resolve
        run: |
          set -euo pipefail
          scripts/nightly/resolve-latest.sh _work/nightly
          echo "version=$(cat _work/nightly/version)" >> "$GITHUB_OUTPUT"

      - name: Extract binary fingerprint and diff against baseline
        id: binary
        run: |
          set -euo pipefail
          scripts/nightly/binary-fingerprint.py \
            --tarball _work/nightly/native.tgz \
            --version "$(cat _work/nightly/version)" \
            > _work/nightly/fingerprint-binary.json
          cat _work/nightly/fingerprint-binary.json

          BASE=baseline/fingerprint-binary.json
          NEW=_work/nightly/fingerprint-binary.json
          if [ ! -f "$BASE" ] || jq -e '._placeholder' "$BASE" >/dev/null 2>&1; then
            echo "baseline not populated yet — treating as drift"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          elif diff -u <(jq --sort-keys . "$BASE") <(jq --sort-keys . "$NEW"); then
            echo "no binary drift"
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "binary drift detected"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      # --- CHECK 2: wire capture against the local 401 upstream. ---------
      - name: Install the sha512-verified CLI
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: scripts/recon/fetch-binary.sh "$VERSION" --tgz _work/nightly/native.tgz

      - name: Seed onboarding state
        run: scripts/nightly/prepare-home.sh

      - name: Capture both surfaces through mitmdump
        id: capture
        continue-on-error: true
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          DISABLE_TELEMETRY: '1'
          DISABLE_AUTOUPDATER: '1'
          DISABLE_BUG_COMMAND: '1'
          DISABLE_COST_WARNINGS: '1'
          DISABLE_ERROR_REPORTING: '1'
        run: |
          set -euo pipefail
          mkdir -p _work/nightly/captures
          python scripts/nightly/fake-upstream.py --port 19099 \
            > _work/nightly/fake-upstream.log 2>&1 &
          UPSTREAM_PID=$!
          trap 'kill "$UPSTREAM_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:19099/; then break; fi
            sleep 0.5
          done

          CC_MITMDUMP="$(command -v mitmdump)" \
          CC_RECON_PYTHON="$(command -v python)" \
          CC_CAPTURE_DIR="$PWD/_work/nightly/captures" \
          CC_CAPTURE_PORT=18093 \
          ANTHROPIC_AUTH_TOKEN="$FAKE_ACCESS_TOKEN" \
          ANTHROPIC_BASE_URL='http://127.0.0.1:19099' \
          scripts/recon/capture-live.sh --version "$VERSION" --surface both

      - name: Compare fresh captures against testdata/captures
        id: stage
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          scripts/nightly/stage-drift.py \
            --captures-dir _work/nightly/captures \
            --repo-root "$PWD" \
            --version "$VERSION" \
            > _work/nightly/drift-verdict.json
          cat _work/nightly/drift-verdict.json
          if jq -e '.drifted' _work/nightly/drift-verdict.json >/dev/null; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          fi
          if jq -e '.surfaces | to_entries | any(.value.captured == false)' \
              _work/nightly/drift-verdict.json >/dev/null; then
            echo "incomplete=true" >> "$GITHUB_OUTPUT"
          else
            echo "incomplete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage binary baseline for the drift PR
        if: >-
          github.event_name != 'pull_request'
          && steps.binary.outputs.drifted == 'true'
        run: |
          set -euo pipefail
          mkdir -p baseline
          cp _work/nightly/fingerprint-binary.json baseline/fingerprint-binary.json

      # Mechanical retarget from the staged captures: version constants,
      # x-stainless-package-version, and the embedded intro. Betas / agent
      # identifiers stay manual (membership judgment) — stage-drift.py reports
      # them. Runs on PR runs too: the PR validates the retargeted plugin
      # against the same captures via the test suite below.
      # The hint is recorded BEFORE the retarget so it reflects the state the
      # run started from, not the state the retarget produced.
      - name: Record retarget hint
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP 'cliTargetVersion = "\K[^"]+' internal/mimicry/mimicry.go)
          LATEST=$(cat _work/nightly/version)
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "RETARGET=not needed (plugin targets $CURRENT)" >> "$GITHUB_ENV"
          else
            echo "RETARGET=needed (plugin targeted $CURRENT, upstream released $LATEST)" >> "$GITHUB_ENV"
          fi

      - name: Retarget plugin from new captures
        id: retarget
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts/nightly/retarget.py \
            --version "$(cat _work/nightly/version)" \
            --repo-root "$PWD"

      - name: Run the Go test suite on the staged tree
        id: tests
        continue-on-error: true
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          scripts/setup-sdk.sh
          go test -race -count=1 ./... 2>&1 | tee _work/nightly/go-test.log

      - name: Record test verdict
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "TESTS=passed" >> "$GITHUB_ENV"
          else
            echo "TESTS=failed" >> "$GITHUB_ENV"
          fi

      # Only the scheduled/push run opens a drift PR: a pull_request run is a
      # validation gate and must not push branches or mutate the PR itself
      # (the GITHUB_TOKEN cannot, and must not, re-trigger workflows).
      - name: Open drift PR
        id: pr
        if: >-
          github.event_name != 'pull_request'
          && (steps.binary.outputs.drifted == 'true' || steps.stage.outputs.drifted == 'true')
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: fingerprint-drift/nightly
          base: main
          title: 'ci: fingerprint drift detected (${{ steps.resolve.outputs.version }})'
          commit-message: |
            ci: update fingerprint captures to ${{ steps.resolve.outputs.version }}

            Detected by the nightly fingerprint-drift workflow. CHECK 1
            (binary strings) and/or CHECK 2 (wire capture) produced a
            fingerprint that differs from what the repository tracks.
          body: |
            Automated drift detection from `.github/workflows/fingerprint-nightly.yml`.

            **Upstream version**: `${{ steps.resolve.outputs.version }}`
            **CHECK 1 (binary strings)**: ${{ steps.binary.outputs.drifted == 'true' && 'drifted — baseline/fingerprint-binary.json updated' || 'no drift' }}
            **CHECK 2 (wire capture)**: ${{ steps.stage.outputs.drifted == 'true' && 'drifted' || 'no drift' }}${{ steps.stage.outputs.incomplete == 'true' && ' (INCOMPLETE — at least one surface was not captured; see the workflow log)' || '' }}
            **Tests**: ${{ env.TESTS }}
            **Retarget**: ${{ env.RETARGET }} — ${{ steps.retarget.outcome == 'success' && 'applied mechanically (version constants + x-stainless-package-version + embedded intro); betas and agent identifiers need manual review' || 'NOT applied (script failed or found nothing to retarget) — see the workflow log' }}

            Same-version wire drift is reported here but existing fixtures are
            NOT overwritten — they carry real-credential provenance (PROC-001).
            A new CLI version gets its captures staged under
            `testdata/captures/v${{ steps.resolve.outputs.version }}/`; review
            them, then retarget the plugin per PROC-001.

            Note: PRs opened with the default `GITHUB_TOKEN` do not trigger
            `pull_request` workflows; the test verdict above is from this run.
          labels: |
            fingerprint-drift
            automated
          delete-branch: true

      - name: Upload verdict + test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fingerprint-nightly-verdict
          path: |
            _work/nightly/drift-verdict.json
            _work/nightly/go-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Scrub raw flow files
        if: always()
        run: |
          # Defense in depth: raw flows carry the (fake) auth header and full
          # bodies; they must never survive past this point.
          find _work \( -name '*.flow' -o -name '*.mitm' \) -delete 2>/dev/null || true

      # Last step on purpose: everything above (PR included) must get its
      # chance to run before the job is marked failed.
      - name: Fail the run on incomplete capture or failing tests
        if: >-
          steps.capture.outcome == 'failure'
          || steps.stage.outputs.incomplete == 'true'
          || steps.retarget.outcome == 'failure'
          || env.TESTS == 'failed'
        run: |
          echo "::error::nightly incomplete: capture=${{ steps.capture.outcome }} incomplete=${{ steps.stage.outputs.incomplete }} retarget=${{ steps.retarget.outcome }} tests=${{ env.TESTS }}"
          exit 1
